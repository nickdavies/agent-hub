[package]
name = "agent-hub-web-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
openidconnect = "4"
protocol = { path = "../protocol" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tower-sessions = "0.14"
tracing = "0.1"
