[package]
name = "agent-hub-approvals-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "agent-hub-approvals-server"
path = "src/main.rs"

[dependencies]
agent-hub-approval-service = { path = "../approval-service" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
protocol = { path = "../protocol" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
agent-hub-approval-client = { path = "../approval-client" }
libc = "0.2"
protocol = { path = "../protocol" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
