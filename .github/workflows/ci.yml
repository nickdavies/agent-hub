name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  gateway-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Gateway HTTP network outcomes
        run: cargo test -p agent-hub-gateway --test http_outcomes -- --ignored
      - name: Gateway CLI network outcomes
        run: cargo test -p agent-hub-gateway --test agent_hub_run_cli -- --ignored

  executor-slow-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Executor restart recovery
        run: cargo test -p agent-hub-executor --test executor_contract cancelled_egress_late_creates_recover_all_resource_kinds_after_restart -- --ignored --exact

  local-agent-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Local-agent process-global fault coverage
        run: |
          cargo test -p local-agent tests::cleanup_running_after_hook_observes_persisted_phase_before_cleanup -- --ignored --exact
          cargo test -p local-agent tests::reconciled_workspace_preparing_enters_persisted_cleanup_before_reporting -- --ignored --exact
          cargo test -p local-agent tests::event_publication_completion_fault_replays_after_acknowledged_delivery -- --ignored --exact
          cargo test -p local-agent tests::central_execution_fault_hook_targets_every_lifecycle_and_operation_boundary -- --ignored --exact
          cargo test -p local-agent tests::central_execution_pause_hook_uses_ready_and_release_files -- --ignored --exact

  typecheck-opencode-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-plugins/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate schemas and types
        run: bun run generate
      - name: Check for stale generated files
        run: git diff --exit-code -- generated/
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

  approvals-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Approval release formatting
        run: >-
          cargo fmt --check
          -p protocol
          -p agent-hub-web-auth
          -p agent-hub-approval-client
          -p agent-hub-approval-service
          -p agent-hub-approvals-server
          -p agent-hub-gateway
      - name: Approval release clippy
        run: >-
          cargo clippy --all-targets
          -p protocol
          -p agent-hub-web-auth
          -p agent-hub-approval-client
          -p agent-hub-approval-service
          -p agent-hub-approvals-server
          -p agent-hub-gateway
          -- -D warnings
      - name: Approval release check
        run: >-
          cargo check --all-targets
          -p protocol
          -p agent-hub-web-auth
          -p agent-hub-approval-client
          -p agent-hub-approval-service
          -p agent-hub-approvals-server
          -p agent-hub-gateway
      - name: Approval release tests
        run: >-
          cargo test
          -p protocol
          -p agent-hub-web-auth
          -p agent-hub-approval-client
          -p agent-hub-approval-service
          -p agent-hub-approvals-server
          -p agent-hub-gateway
      - name: Approval gateway network compatibility
        run: |
          cargo test -p agent-hub-gateway --test http_outcomes -- --ignored
          cargo test -p agent-hub-gateway --test real_service_compat -- --ignored
      - name: Build approval release binaries
        run: cargo build --locked --release -p agent-hub-approvals-server -p agent-hub-gateway
      - name: Package approval release
        run: deploy/approvals-server/package-release.sh target/release target/approval-release
      - name: Verify approval release checksums and manifests
        run: |
          cd target/approval-release
          sha256sum --check SHA256SUMS
          grep -q '"integrity_digest"' approvals-server-release-manifest.json
          grep -q '"integrity_digest"' gateway-release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: approvals-release-${{ github.sha }}
          path: target/approval-release/
          if-no-files-found: error

  approvals-deploy-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Isolated approvals deployment contract
        run: bash deploy/approvals-server/test-deploy.sh

  docker-check:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-gate:
    needs:
      - approvals-release
      - approvals-deploy-harness
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require release checks
        env:
          APPROVALS_RELEASE: ${{ needs.approvals-release.result }}
          APPROVALS_DEPLOY_HARNESS: ${{ needs.approvals-deploy-harness.result }}
        run: |
          test "$APPROVALS_RELEASE" = success
          test "$APPROVALS_DEPLOY_HARNESS" = success
