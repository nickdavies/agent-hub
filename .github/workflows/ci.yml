name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  gateway-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Gateway HTTP network outcomes
        run: cargo test -p agent-hub-gateway --test http_outcomes -- --ignored
      - name: Gateway CLI network outcomes
        run: cargo test -p agent-hub-gateway --test agent_hub_run_cli -- --ignored

  executor-slow-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Executor restart recovery
        run: cargo test -p agent-hub-executor --test executor_contract cancelled_egress_late_creates_recover_all_resource_kinds_after_restart -- --ignored --exact

  local-agent-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Local-agent process-global fault coverage
        run: |
          cargo test -p local-agent tests::cleanup_running_after_hook_observes_persisted_phase_before_cleanup -- --ignored --exact
          cargo test -p local-agent tests::reconciled_workspace_preparing_enters_persisted_cleanup_before_reporting -- --ignored --exact
          cargo test -p local-agent tests::event_publication_completion_fault_replays_after_acknowledged_delivery -- --ignored --exact
          cargo test -p local-agent tests::central_execution_fault_hook_targets_every_lifecycle_and_operation_boundary -- --ignored --exact
          cargo test -p local-agent tests::central_execution_pause_hook_uses_ready_and_release_files -- --ignored --exact

  typecheck-opencode-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provider-plugins/opencode
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Regenerate schemas and types
        run: bun run generate
      - name: Check for stale generated files
        run: git diff --exit-code -- generated/
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

  approval-service-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Approval service and server tests
        run: cargo test -p agent-hub-approval-service -p agent-hub-approvals-server

  approvals-deploy-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Isolated approvals deployment contract
        run: bash deploy/approvals-server/test-deploy.sh

  docker-check:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-gate:
    needs:
      - check
      - gateway-network
      - executor-slow-recovery
      - local-agent-faults
      - typecheck-opencode-plugin
      - approval-service-server
      - approvals-deploy-harness
      - docker-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require release checks
        env:
          CHECK: ${{ needs.check.result }}
          GATEWAY_NETWORK: ${{ needs.gateway-network.result }}
          EXECUTOR_SLOW_RECOVERY: ${{ needs.executor-slow-recovery.result }}
          LOCAL_AGENT_FAULTS: ${{ needs.local-agent-faults.result }}
          OPENCODE_PLUGIN: ${{ needs.typecheck-opencode-plugin.result }}
          APPROVAL_SERVICE_SERVER: ${{ needs.approval-service-server.result }}
          APPROVALS_DEPLOY_HARNESS: ${{ needs.approvals-deploy-harness.result }}
          DOCKER_CHECK: ${{ needs.docker-check.result }}
        run: |
          test "$CHECK" = success
          test "$GATEWAY_NETWORK" = success
          test "$EXECUTOR_SLOW_RECOVERY" = success
          test "$LOCAL_AGENT_FAULTS" = success
          test "$OPENCODE_PLUGIN" = success
          test "$APPROVAL_SERVICE_SERVER" = success
          test "$APPROVALS_DEPLOY_HARNESS" = success
          if [[ "${{ github.event_name }}" == pull_request ]]; then
            test "$DOCKER_CHECK" = success
          else
            test "$DOCKER_CHECK" = skipped
          fi

  docker-push:
    needs: release-gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
