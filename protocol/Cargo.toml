[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
schemars = { version = "1", features = ["uuid1", "chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
strum = { version = "0.27", features = ["derive"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
