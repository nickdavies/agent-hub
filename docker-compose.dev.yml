services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    user: "1000:1001"
    command: ["serve"]
    env_file:
      - .env
    environment:
      AUTH_MODE: ${AUTH_MODE:-none}
      AGENT_HUB_APPROVALS_SERVER: ${AGENT_HUB_APPROVALS_SERVER:-}
      AGENT_HUB_APPROVALS_TOKEN: ${AGENT_HUB_APPROVALS_TOKEN:-}
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0:8080}
      WORKFLOWS_DIR: /workflows
      CONFIG_ROOT: ${CONFIG_ROOT:-/config}
      ORCHESTRATION_DB: /data/orchestration.sqlite3
      TASK_ADAPTER: file
      TASK_DIR: /tasks
      TASK_STATE_DIR: /data/task-state
      ARTIFACT_STORE_ROOT: /artifacts
      GITHUB_POLLING_ENABLED: ${GITHUB_POLLING_ENABLED:-true}
      GITHUB_POLL_INTERVAL_SECS: ${GITHUB_POLL_INTERVAL_SECS:-30}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
      # Token for `kind=github` rows in [[system.scm_hosts]] that point
      # at a GitHub Enterprise instance. The default registry expects
      # this in a row pointing at github.snooguts.net.
      GITHUB_ENTERPRISE_TOKEN: ${GITHUB_ENTERPRISE_TOKEN:-}
      GRPC_LISTEN_ADDR: 0.0.0.0:50051
      HOME: /home/nick.davies
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - 127.0.0.1:8180:8080
      - 127.0.0.1:50151:50051
    volumes:
      - ../agent-hub-configs/workflows:/workflows:ro
      - ../agent-hub-configs:/config:ro
      - ./dev-data/server:/data
      - ./dev-data/tasks:/tasks
      - ${ARTIFACT_STORE_ROOT_HOST:-./dev-data/artifacts}:/artifacts
      - /home/nick.davies/code:/home/nick.davies/code:ro
      - /home/nick.davies/workspaces:/home/nick.davies/workspaces:ro
    restart: unless-stopped
